[package]
name = "nitop"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "A btop-style terminal monitor for network interfaces"
authors = ["CP Knight <chris@cpknight.io>", "Claude <noreply@anthropic.com>", "Grok (xAI)"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cpknight/nitop"
keywords = ["network", "monitor", "tui", "bandwidth", "btop"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/.github", "/docs"]

[dependencies]
if-addrs = "0.15.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
