name: Bug report
description: Something doesn't work or displays incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nitop version
      description: The output of `nitop --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and terminal
      placeholder: Arch Linux, Alacritty
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or other details
      description: A screenshot can show your SSID, IP and MAC addresses, so please blur anything you'd rather keep private.
